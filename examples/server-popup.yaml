# Server-popupen: ett kort, som søvn-, klima- og planterpopupen.
#
# Jeg leste dashbordet, og de tre popupene du peker på har alle samme form — ett «pro»-
# kort og en gap-card, ingen sammensatt YAML:
#
#   - type: custom:ki-sovn-pro-card
#   - type: custom:ki-klima-strom-kort
#   - type: custom:ki-planter-pro-card
#       scene: true
#       scene_hoyde: 200
#
# Serverpopupen følger nå den formen. Kortet eier alt: animert scene øverst, faner med
# helseprikk, fliser i `universal_sensor_ny` sin form (160 px, rundt 52 px ikonfelt,
# verdi i 2em/300), lister og knapper.
#
# Alt finnes automatisk — UniFi-enhetene, Proxmox-containerne og -maskinene, Unraids
# containere, disker og delinger. `navn_kort` gir bare penere navn.

type: custom:bubble-card
card_type: pop-up
name: Server
icon: mdi:server
hash: '#server'
is_sidebar_hidden: true
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
styles: >
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px !important;
  }

  #header-container > div > div { background: var(--gray000) !important; }

  #header-container > button { background: none; }

  .icon-container { background-color: var(--gray1000) !important; }

  .icon-container > ha-icon { color: var(--black) !important; opacity: 1
  !important; }

  .bubble-icon { --mdc-icon-size: 24px !important; }

  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;
  }

  .bubble-close-button { background-color: var(--gray200) !important;
  border-radius: 50%; }

cards:
  - type: custom:gap-card
    height: 0

  - type: custom:ki-server-card
    unraid: d_day_darling
    qbit: sensor.qbittorrent_
    pve_node: sensor.1_node_pve_

    # Scenen øverst: rack med diskblink, vifte når noden jobber, pakker når nettet er
    # oppe. `scene: false` slår den av, `scene_hoyde` endrer høyden.
    scene: true
    scene_hoyde: 200

    navn_kort:
      adguard_home: AdGuard Home
      binhex_jellyfin: Jellyfin
      binhex_minecraftserver: Minecraft
      binhex_official_metube: MeTube
      binhex_plexpass: Plex
      binhex_prowlarr: Prowlarr (binhex)
      binhex_qbittorrentvpn: qBittorrent VPN
      binhex_radarr: Radarr
      binhex_readarr: Readarr
      binhex_seerr: Seerr
      binhex_sonarr: Sonarr
      cloudflare_ddns: Cloudflare DDNS
      cloudflaredtunnel: Cloudflared
      glance_1: Glance
      homeassistant_inabox: HA in a box
      immich_machine_learning: Immich ML
      immich_postgres: Immich DB
      immich_redis: Immich Redis
      immich_server: Immich
      jellyfin_rewind: Jellyfin Rewind
      jellyplex_watched: Jellyplex
      lyrionmusicserver: Lyrion
      portainerce: Portainer
      silo_postgresql: Silo DB
      speedtest_by_openspeedtest: OpenSpeedTest
      speedtest_tracker: Speedtest Tracker
      uptimekuma: Uptime Kuma
      cach: Cache
      disk1: Disk 1
      disk2: Disk 2
      disk3: Disk 3
      disk4: Disk 4
      aoosar_x_linux: Aoosar X Linux
      tank: tank (ZFS)

  - type: custom:gap-card
    height: 36

popup_mode: default

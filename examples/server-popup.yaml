# Server-popupen, ny struktur.
#
# Fire faner uten nøsting: Nettverk, Unraid, Proxmox, Nedlasting. Formspråket er fra
# klima-, vannings- og søvnpopupen: fanerad med ikon over tekst, statushero øverst,
# seksjonsoverskrifter, og detaljene under.
#
# Hver fane er bygget i den rekkefølgen du bruker dem:
#   1. Statuskort   — er alt friskt? Én linje, og hva som feiler om noe gjør det.
#   2. Handlinger   — det du starter, stopper og restarter.
#   3. Detaljer     — tallene, for når noe er galt.
#
# Den gamle popupen hadde tre nivåer faner og tolv underfaner. Alt innholdet er med, men
# nå på ett nivå.

type: custom:bubble-card
card_type: pop-up
name: Server
icon: mdi:server
hash: '#server'
is_sidebar_hidden: true
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
styles: >
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  }

  #header-container > div > div { background: var(--gray000)!important; }

  #header-container > button { background: none; }

  .icon-container { background-color: var(--gray1000)!important; }

  .icon-container > ha-icon { color: var(--black)!important; opacity:
  1!important; }

  .bubble-icon { --mdc-icon-size: 24px !important; }

  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;
  }

  .bubble-close-button { background-color: var(--gray200) !important;
  border-radius: 50%; }

cards:
  - type: custom:gap-card
    height: 0

  # Fanerada. Ikon over tekst, som i klimakortet — og på smal skjerm er ikonene alene
  # nok til at fire faner får plass uten å rulle.
  - type: custom:simple-tabs
    alignment: center
    tab_position: top
    show_fade: false
    tabs_gap: 4px
    button_padding: 9px 16px
    background-color: transparent
    border-color: transparent
    text-color: rgba(255, 255, 255, 0.72)
    hover-color: rgba(255, 255, 255, 0.95)
    container_background: transparent
    container_padding: 0 0 12px 0
    card_mod:
      # `width: fit-content` med `overflow: hidden` er grunnen til at rada falt ut av
      # skjermen: den blir like bred som innholdet og klipper det som ikke får plass,
      # i stedet for å krympe eller rulle. Nå har den maksbredde og ruller sidelengs.
      style: |
        .tabs-container {
          width: fit-content !important;
          max-width: 100% !important;
          min-width: 0 !important;
          margin: 0 auto !important;
          padding: 2px 2px !important;
          border: 1px solid rgba(255, 255, 255, 0.3);
          border-radius: 999px;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-button {
          border-radius: 999px !important;
          font-weight: 500;
          flex: 0 0 auto !important;
          white-space: nowrap !important;
        }
        .tab-button.active {
          background: var(--active-big) !important;
          color: rgba(70, 58, 64, 0.95) !important;
          box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
        }
    tabs:
      # ==================================================== Nettverk
      - title: Nettverk
        card:
          type: vertical-stack
          cards:
            - type: custom:ki-status-card
              navn: Nettverk
              ikon: mdi:lan-connect
              ok_tekst: Nettet er oppe
              sjekker:
                - entity: device_tracker.oslo_dream_machine_pro
                  ok: home
                  feil: Ruteren svarer ikke
                  alvor: rod
                - entity: device_tracker.treets_usw_24_poe
                  ok: home
                  feil: Treets-switchen svarer ikke
                  alvor: rod
                - entity: device_tracker.veien_usw_24_g2
                  ok: home
                  feil: Veien-switchen svarer ikke
                  alvor: rod
                - entity: device_tracker.spisebord_usw_flex_mini
                  ok: home
                  feil: Spisebord-switchen svarer ikke
                - entity: device_tracker.fuglen_u7_pro_xg
                  ok: home
                  feil: Fuglen AP svarer ikke
                - entity: device_tracker.posten_u7_lite
                  ok: home
                  feil: Posten AP svarer ikke
                - entity: sensor.oslo_dream_machine_pro_google_wan_latency
                  over: 120
                  feil: 'Høy latens: {verdi} ms'
              tall:
                - navn: Klienter
                  entity: sensor.oslo_dream_machine_pro_clients
                  desimaler: 0
                - navn: Latens
                  entity: sensor.oslo_dream_machine_pro_google_wan_latency
                  enhet: ' ms'
                  desimaler: 0
                - navn: CPU
                  entity: sensor.oslo_dream_machine_pro_cpu_utilisation_2
                  enhet: ' %'
                  desimaler: 0
                - navn: Temp
                  entity: sensor.oslo_dream_machine_pro_cpu_temperature_2
                  enhet: °
                  desimaler: 0

            - type: custom:gap-card
              height: 10

            # Enhetene som fliser i stedet for kort stablet nedover. Alle seks på én
            # skjerm; trykk på en flis, og detaljene glir inn over rutenettet. Det er
            # dette som fjerner rullingen — ikke lavere kort, men at bare én enhet
            # vises av gangen. Treets har PoE-portene under detaljene sine.
            - type: custom:ki-rack-card
              tittel: enhetene
              kolonner: 2
              enheter:
              - navn: Dream Machine Pro
                ikon: mdi:router-network
                status: device_tracker.oslo_dream_machine_pro
                status_pa:
                - home
                tall: sensor.oslo_dream_machine_pro_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.oslo_dream_machine_pro_cpu_utilisation_2
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Dream Machine Pro
                  figur: ruter
                  status: device_tracker.oslo_dream_machine_pro
                  oppetid: sensor.oslo_dream_machine_pro_uptime_2
                  oppdatering: update.oslo_dream_machine_pro_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.oslo_dream_machine_pro_cpu_utilisation_2
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.oslo_dream_machine_pro_memory_utilisation_2
                    enhet: '%'
                  - navn: Temp
                    entity: sensor.oslo_dream_machine_pro_cpu_temperature_2
                    enhet: °
                    maks: 90
                    gul: 60
                    rod: 75
                  info:
                  - navn: Google
                    entity: sensor.oslo_dream_machine_pro_google_wan_latency
                    enhet: ' ms'
                    varsel_over: 80
                  - navn: Cloudflare
                    entity: sensor.oslo_dream_machine_pro_cloudflare_wan_latency
                    enhet: ' ms'
                    varsel_over: 80
                  - navn: Microsoft
                    entity: sensor.oslo_dream_machine_pro_microsoft_wan_latency
                    enhet: ' ms'
                    varsel_over: 80
                  - navn: Local temp
                    entity: sensor.oslo_dream_machine_pro_local_temperature
                    enhet: ' °C'
                    varsel_over: 70
                  - navn: Klienter
                    entity: sensor.oslo_dream_machine_pro_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.oslo_dream_machine_pro_state
                  - navn: Uplink MAC
                    entity: sensor.oslo_dream_machine_pro_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.oslo_dream_machine_pro_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Dream Machine Pro?
              - navn: Treets
                ikon: mdi:switch
                status: device_tracker.treets_usw_24_poe
                status_pa:
                - home
                tall: sensor.treets_usw_24_poe_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.treets_usw_24_poe_cpu_utilisation
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Treets
                  figur: switch
                  status: device_tracker.treets_usw_24_poe
                  oppetid: sensor.treets_usw_24_poe_uptime
                  oppdatering: update.treets_usw_24_poe_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.treets_usw_24_poe_cpu_utilisation
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.treets_usw_24_poe_memory_utilisation
                    enhet: '%'
                  info:
                  - navn: Klienter
                    entity: sensor.treets_usw_24_poe_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.treets_usw_24_poe_state
                  - navn: Uplink MAC
                    entity: sensor.treets_usw_24_poe_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.treets_usw_24_poe_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Treets?
                under:
                - type: custom:ki-porter-card
                  tittel: Porter (strømsykling)
                  prefiks: button.treets_usw_24_poe_port_
                  etterfiks: _power_cycle
                  antall: 16
                  kolonner: 4
                  bekreft: Strømsykle {port}?
              - navn: Veien
                ikon: mdi:switch
                status: device_tracker.veien_usw_24_g2
                status_pa:
                - home
                tall: sensor.veien_usw_24_g2_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.veien_usw_24_g2_cpu_utilisation
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Veien
                  figur: switch
                  status: device_tracker.veien_usw_24_g2
                  oppetid: sensor.veien_usw_24_g2_uptime
                  oppdatering: update.veien_usw_24_g2_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.veien_usw_24_g2_cpu_utilisation
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.veien_usw_24_g2_memory_utilisation
                    enhet: '%'
                  info:
                  - navn: Klienter
                    entity: sensor.veien_usw_24_g2_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.veien_usw_24_g2_state
                  - navn: Uplink MAC
                    entity: sensor.veien_usw_24_g2_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.veien_usw_24_g2_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Veien?
              - navn: Spisebord
                ikon: mdi:switch
                status: device_tracker.spisebord_usw_flex_mini
                status_pa:
                - home
                tall: sensor.spisebord_usw_flex_mini_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.spisebord_usw_flex_mini_cpu_utilisation
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Spisebord
                  figur: switch
                  status: device_tracker.spisebord_usw_flex_mini
                  oppetid: sensor.spisebord_usw_flex_mini_uptime
                  oppdatering: update.spisebord_usw_flex_mini_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.spisebord_usw_flex_mini_cpu_utilisation
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.spisebord_usw_flex_mini_memory_utilisation
                    enhet: '%'
                  info:
                  - navn: Klienter
                    entity: sensor.spisebord_usw_flex_mini_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.spisebord_usw_flex_mini_state
                  - navn: Uplink MAC
                    entity: sensor.spisebord_usw_flex_mini_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.spisebord_usw_flex_mini_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Spisebord?
                  - navn: LED
                    entity: light.spisebord_usw_flex_mini_led
                    ikon: mdi:led-outline
              - navn: Fuglen
                ikon: mdi:access-point
                status: device_tracker.fuglen_u7_pro_xg
                status_pa:
                - home
                tall: sensor.fuglen_u7_pro_xg_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.fuglen_u7_pro_xg_cpu_utilisation
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Fuglen
                  figur: ap
                  status: device_tracker.fuglen_u7_pro_xg
                  oppetid: sensor.fuglen_u7_pro_xg_uptime
                  oppdatering: update.fuglen_u7_pro_xg_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.fuglen_u7_pro_xg_cpu_utilisation
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.fuglen_u7_pro_xg_memory_utilisation
                    enhet: '%'
                  info:
                  - navn: Klienter
                    entity: sensor.fuglen_u7_pro_xg_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.fuglen_u7_pro_xg_state
                  - navn: Uplink MAC
                    entity: sensor.fuglen_u7_pro_xg_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.fuglen_u7_pro_xg_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Fuglen?
                  - navn: LED
                    entity: light.fuglen_u7_pro_xg_led
                    ikon: mdi:led-outline
              - navn: Posten
                ikon: mdi:access-point
                status: device_tracker.posten_u7_lite
                status_pa:
                - home
                tall: sensor.posten_u7_lite_clients
                tall_enhet: ' klienter'
                tall_desimaler: 0
                nokkel: sensor.posten_u7_lite_cpu_utilisation
                nokkel_enhet: ' % CPU'
                detalj:
                  navn: Posten
                  figur: ap
                  status: device_tracker.posten_u7_lite
                  oppetid: sensor.posten_u7_lite_uptime
                  oppdatering: update.posten_u7_lite_firmware
                  maalinger:
                  - navn: CPU
                    entity: sensor.posten_u7_lite_cpu_utilisation
                    enhet: '%'
                  - navn: Minne
                    entity: sensor.posten_u7_lite_memory_utilisation
                    enhet: '%'
                  info:
                  - navn: Klienter
                    entity: sensor.posten_u7_lite_clients
                    enhet: ''
                  - navn: Tilstand
                    entity: sensor.posten_u7_lite_state
                  - navn: Uplink MAC
                    entity: sensor.posten_u7_lite_uplink_mac
                  knapper:
                  - navn: Restart
                    entity: button.posten_u7_lite_restart
                    ikon: mdi:restart
                    farge: var(--orange)
                    bekreft: Restarte Posten?
                  - navn: LED
                    entity: light.posten_u7_lite_led
                    ikon: mdi:led-outline

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Wi-Fi
            - type: custom:ki-wifi-card
              navn: Skuta I Byen
              qr: image.skuta_i_byen_qr_code
              klienter: sensor.skuta_i_byen_clients
              bryter: switch.skuta_i_byen_enabled
            - type: custom:gap-card
              height: 36

      # ==================================================== Unraid
      - title: Unraid
        card:
          type: vertical-stack
          cards:
            - type: custom:ki-status-card
              navn: Unraid — D-Day Darling
              ikon: mdi:server
              ok_tekst: Alt friskt
              sjekker:
                - entity: binary_sensor.d_day_darling_array_started
                  ok: 'on'
                  feil: Array er stoppet
                  alvor: rod
                - entity: binary_sensor.d_day_darling_disks_missing
                  ok: 'off'
                  feil: Disker mangler
                  alvor: rod
                - entity: binary_sensor.d_day_darling_disks_invalid
                  ok: 'off'
                  feil: Disker er ugyldige
                  alvor: rod
                - entity: binary_sensor.d_day_darling_disks_disabled
                  ok: 'off'
                  feil: Disker er deaktivert
                  alvor: rod
                - entity: binary_sensor.d_day_darling_filesystems_unmountable
                  ok: 'off'
                  feil: Filsystem kan ikke monteres
                  alvor: rod
                - entity: binary_sensor.d_day_darling_parity_valid
                  ok: 'on'
                  feil: Pariteten er ugyldig
                  alvor: rod
                - entity: binary_sensor.d_day_darling_disk_parity_health
                  ok: 'off'
                  feil: Paritetsdisken har feil
                  alvor: rod
                - entity: binary_sensor.d_day_darling_config_valid
                  ok: 'on'
                  feil: Konfigurasjonen er ugyldig
                  alvor: rod
                - entity: sensor.d_day_darling_active_notifications
                  over: 0
                  feil: '{verdi} varsler fra Unraid'
                - entity: sensor.d_day_darling_container_updates_available
                  over: 0
                  feil: '{verdi} containeroppdateringer'
                - entity: binary_sensor.d_day_darling_cloud_connected
                  ok: 'on'
                  feil: Ikke koblet til Unraid Connect
                - entity: binary_sensor.d_day_darling_safe_mode
                  ok: 'off'
                  feil: Kjører i sikker modus
              tall:
                - navn: CPU
                  entity: sensor.d_day_darling_cpu_usage
                  enhet: ' %'
                  desimaler: 0
                - navn: RAM
                  entity: sensor.d_day_darling_ram_usage
                  enhet: ' %'
                  desimaler: 0
                - navn: Array
                  entity: sensor.d_day_darling_array_usage
                  enhet: ' %'
                  desimaler: 0
                - navn: Temp
                  entity: sensor.d_day_darling_cpu_temperature
                  enhet: °
                  desimaler: 0

            # Paritetssjekken vises bare mens den kjører. Resten av tiden er de fem
            # tallene om den bare støy.
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.d_day_darling_parity_check_running
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:gap-card
                    height: 10
                  - type: custom:ki-section-card
                    title: Paritetssjekk pågår
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:ki-sensor-card
                        storrelse: liten
                        entity: sensor.d_day_darling_parity_progress
                        navn: Framdrift
                        ikon: mdi:percent
                        enhet: ' %'
                        stolpe: true
                        maks: 100
                      - type: custom:ki-sensor-card
                        storrelse: liten
                        entity: sensor.d_day_darling_parity_check_speed
                        navn: Hastighet
                        ikon: mdi:speedometer
                      - type: custom:ki-sensor-card
                        storrelse: liten
                        entity: sensor.d_day_darling_parity_check_elapsed
                        navn: Brukt tid
                        ikon: mdi:timer-outline
                      - type: custom:ki-sensor-card
                        storrelse: liten
                        entity: sensor.d_day_darling_last_parity_check
                        navn: Siste sjekk
                        ikon: mdi:calendar-check

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Virtuelle maskiner
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:ki-toggle-card
                  entity: switch.d_day_darling_vm_home_assistant
                  name: Home Assistant
                  icon: mdi:home-assistant
                - type: custom:ki-toggle-card
                  entity: switch.d_day_darling_vm_home_assistantny
                  name: Home Assistant Ny
                  icon: mdi:home-assistant

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Containere
            - type: custom:ki-container-card
              prefiks: switch.d_day_darling_container_
              oppdateringer: sensor.d_day_darling_container_updates_available
              navn_kort:
                adguard_home: AdGuard Home
                binhex_jellyfin: Jellyfin
                binhex_minecraftserver: Minecraft
                binhex_official_metube: MeTube
                binhex_plexpass: Plex
                binhex_prowlarr: Prowlarr (binhex)
                binhex_qbittorrentvpn: qBittorrent VPN
                binhex_radarr: Radarr
                binhex_readarr: Readarr
                binhex_seerr: Seerr
                binhex_sonarr: Sonarr
                cloudflare_ddns: Cloudflare DDNS
                cloudflaredtunnel: Cloudflared
                glance_1: Glance
                homeassistant_inabox: HA in a box
                immich_machine_learning: Immich ML
                immich_postgres: Immich DB
                immich_redis: Immich Redis
                immich_server: Immich
                jellyfin_rewind: Jellyfin Rewind
                jellyplex_watched: Jellyplex
                lyrionmusicserver: Lyrion
                portainerce: Portainer
                silo_postgresql: Silo DB
                speedtest_by_openspeedtest: OpenSpeedTest
                speedtest_tracker: Speedtest Tracker
                uptimekuma: Uptime Kuma
              grupper:
                - navn: Media
                  ikon: mdi:play-circle-outline
                  containere: [binhex_plexpass, binhex_jellyfin, jellyfin_rewind,
                    jellyplex_watched, lyrionmusicserver, navidrome, subwave, podgrab,
                    binhex_official_metube]
                - navn: Nedlasting
                  ikon: mdi:download-network-outline
                  containere: [binhex_qbittorrentvpn, binhex_sonarr, binhex_radarr,
                    binhex_readarr, bazarr, binhex_seerr, prowlarr, binhex_prowlarr,
                    flaresolverr]
                - navn: Bilder og filer
                  ikon: mdi:image-multiple-outline
                  containere: [immich_server, immich_machine_learning, immich_postgres,
                    immich_redis, cloudreve, minio, silo, silo_postgresql]
                - navn: Nettverk
                  ikon: mdi:lan
                  containere: [adguard_home, cloudflare_ddns, cloudflaredtunnel, iperf3,
                    speedtest_by_openspeedtest, speedtest_tracker]
                - navn: Smarthus
                  ikon: mdi:home-automation
                  containere: [esphome, frigate, homeassistant_inabox, tofa]
                - navn: Drift
                  ikon: mdi:tools
                  containere: [portainerce, uptimekuma, homarr, glance_1, redis, yubal,
                    binhex_minecraftserver]

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Disker
            - type: custom:ki-bruk-card
              ikon: mdi:harddisk
              prefiks: sensor.d_day_darling_disk_
              etterfiks: _usage
              helse: binary_sensor.d_day_darling_disk_{navn}_health
              helse_ok: 'off'
              terskel_gul: 80
              terskel_rod: 92
              navn_kort:
                disk1: Disk 1
                disk2: Disk 2
                disk3: Disk 3
                disk4: Disk 4
                cach: Cache

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Delinger
            - type: custom:ki-bruk-card
              ikon: mdi:folder-outline
              prefiks: sensor.d_day_darling_share_
              etterfiks: _usage
              navn_kort:
                aoosar_x_linux: Aoosar X Linux
                appdata: Appdata
                isos: Isos
                nextcloud: Nextcloud

            - type: custom:gap-card
              height: 10
            - type: custom:ki-section-card
              title: Detaljer
            - type: custom:ki-enhet-card
              navn: D-Day Darling
              figur: server
              status: binary_sensor.d_day_darling_array_started
              status_pa: ['on']
              tekst_pa: Array startet
              tekst_av: Array stoppet
              oppetid: sensor.d_day_darling_up_since
              maalinger:
                - navn: CPU
                  entity: sensor.d_day_darling_cpu_usage
                  enhet: '%'
                - navn: RAM
                  entity: sensor.d_day_darling_ram_usage
                  enhet: '%'
                - navn: Array
                  entity: sensor.d_day_darling_array_usage
                  enhet: '%'
                - navn: Temp
                  entity: sensor.d_day_darling_cpu_temperature
                  enhet: °
                  maks: 90
                  gul: 65
                  rod: 80
              info:
                - navn: Array
                  entity: sensor.d_day_darling_array_state
                - navn: RAM brukt
                  entity: sensor.d_day_darling_ram_used
                - navn: CPU-effekt
                  entity: sensor.d_day_darling_cpu_power
                - navn: Unraid
                  entity: sensor.d_day_darling_unraid_version
                - navn: Nettverk
                  entity: sensor.d_day_darling_network_access
                - navn: Mover
                  entity: binary_sensor.d_day_darling_mover_active
                  tekst: { 'on': Kjører, 'off': Hviler }
                - navn: Docker CPU
                  entity: sensor.d_day_darling_docker_total_cpu
                  enhet: ' %'
                - navn: Docker RAM
                  entity: sensor.d_day_darling_docker_total_memory
                  enhet: ' %'
                - navn: br0 inn
                  entity: sensor.d_day_darling_network_br0_inbound
                - navn: br0 ut
                  entity: sensor.d_day_darling_network_br0_outbound
                - navn: br0 IP
                  entity: sensor.d_day_darling_network_br0_ip_address
              knapper:
                - navn: Se etter oppdateringer
                  entity: button.d_day_darling_check_container_updates
                  ikon: mdi:cloud-download
            - type: custom:gap-card
              height: 36

      # ==================================================== Proxmox
      - title: Proxmox
        card:
          type: vertical-stack
          cards:
            - type: custom:ki-status-card
              navn: Proxmox-noden
              ikon: mdi:server-network
              ok_tekst: Noden har det bra
              sjekker:
                - entity: sensor.1_node_pve_node_status
                  ok: online
                  feil: Noden er ikke online
                  alvor: rod
                - entity: binary_sensor.overloaded
                  ok: 'off'
                  feil: Noden er overbelastet
                  alvor: rod
                - entity: binary_sensor.disk_overloaded
                  ok: 'off'
                  feil: Disken er overbelastet
                  alvor: rod
                - entity: binary_sensor.stressed
                  ok: 'off'
                  feil: Noden er stresset
                - entity: sensor.1_node_pve_node_updates
                  over: 0
                  feil: '{verdi} pakkeoppdateringer'
                - entity: sensor.3_ct_dispatcharr_100_status
                  ok: running
                  feil: Dispatcharr er stoppet
                - entity: sensor.3_ct_radio_102_status
                  ok: running
                  feil: Radio er stoppet
                - entity: sensor.3_ct_zigbee2mqtt_105_status
                  ok: running
                  feil: Zigbee2MQTT er stoppet
                  alvor: rod
                - entity: sensor.3_ct_pihole_108_status
                  ok: running
                  feil: Pi-hole er stoppet
                  alvor: rod
                - entity: sensor.3_ct_homebridge_112_status
                  ok: running
                  feil: HomeBridge er stoppet
                - entity: sensor.4_vm_haos_18_2_115_status
                  ok: running
                  feil: HAOS-maskinen er stoppet
                  alvor: rod
                - entity: sensor.4_vm_servarr_117_status
                  ok: running
                  feil: Servarr er stoppet
              tall:
                - navn: CPU
                  entity: sensor.1_node_pve_cpu_usage
                  enhet: ' %'
                  desimaler: 0
                - navn: Minne
                  entity: sensor.1_node_pve_memory_usage
                  enhet: ' %'
                  desimaler: 0
                - navn: Load
                  entity: sensor.1_node_pve_load_average_1m
                  desimaler: 2
                - navn: IO wait
                  entity: sensor.1_node_pve_io_wait
                  enhet: ' %'
                  desimaler: 1

            - type: custom:gap-card
              height: 10


# Server-popupen, tredje omgang.
#
# Endringen denne gangen: de store enhetskortene er borte. I stedet tette tallrutenett —
# `ki-tall-card` — der åtte tall får plass i høyden ett enhetskort tok. Hvert tall har
# stolpe og terskler der det finnes en skala, så du ser nivået uten å lese verdien.
#
# Hver fane: statuskort øverst (er alt friskt), så tallrutenettene, så listene og
# handlingene. Fire faner uten nøsting.
#
# Ny informasjon som ikke var med før: swap og rot-FS på Proxmox, node score, KSM,
# kernel- og PVE-versjon, IO wait og idle, br0-trafikk og IP, docker-RAM, paritetsfart
# og framdrift, latens mot alle tre målene, klienter og oppetid per switch og AP, og
# hele køen i qBittorrent med totaler.

type: custom:bubble-card
card_type: pop-up
name: Server
icon: mdi:server
hash: '#server'
is_sidebar_hidden: true
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
styles: ".bubble-pop-up-container {\n  --vertical-stack-card-gap: 0px !important;\n}\n#header-container > div > div { background: var(--gray000) !important; }\n#header-container > button { background: none;\
  \ }\n.icon-container { background-color: var(--gray1000) !important; }\n.icon-container > ha-icon { color: var(--black) !important; opacity: 1 !important; }\n.bubble-icon { --mdc-icon-size: 24px !important;\
  \ }\n.bubble-name {\n  font-size: 30px !important;\n  font-weight: 500;\n  line-height: 1.4 !important;\n  padding: 8px 0 !important;\n}\n.bubble-close-button { background-color: var(--gray200) !important;\
  \ border-radius: 50%; }\n"
cards:
- type: custom:gap-card
  height: 0
- type: custom:simple-tabs
  alignment: center
  tab_position: top
  show_fade: false
  tabs_gap: 4px
  button_padding: 9px 16px
  background-color: transparent
  border-color: transparent
  text-color: rgba(255, 255, 255, 0.72)
  hover-color: rgba(255, 255, 255, 0.95)
  container_background: transparent
  container_padding: 0 0 12px 0
  card_mod:
    style: ".tabs-container {\n  width: fit-content !important;\n  max-width: 100% !important;\n  min-width: 0 !important;\n  margin: 0 auto !important;\n  padding: 2px 2px !important;\n  border: 1px solid\
      \ rgba(255, 255, 255, 0.3);\n  border-radius: 999px;\n  overflow-x: auto !important;\n  overflow-y: hidden !important;\n  scrollbar-width: none;\n  -webkit-overflow-scrolling: touch;\n}\n.tabs-container::-webkit-scrollbar\
      \ { display: none; }\n.tab-button {\n  border-radius: 999px !important;\n  font-weight: 500;\n  flex: 0 0 auto !important;\n  white-space: nowrap !important;\n}\n.tab-button.active {\n  background:\
      \ var(--active-big) !important;\n  color: rgba(70, 58, 64, 0.95) !important;\n  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);\n}\n"

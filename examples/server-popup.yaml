# Server-popupen, bygget av dine egne byggeklosser.
#
# Jeg leste dashbordet ditt nå, og mønsteret er et helt annet enn det jeg har laget:
#
#   · `button-card` med `template: universal_sensor_ny`, to per rad i et `grid`
#   · `custom:mini-graph-card` som stolpediagram, `group_by: date`, med card_mod som
#     gir den `--gray200`-bakgrunn og 32 px verdi
#   · `simple-tabs` med den runde fanerada
#
# Det er nøyaktig formen vanningspopupen har. Serverpopupen følger den nå.
#
# `ki-server-card` er beholdt øverst i hver fane, men bare som hero — statuslinja med
# helsen og det store tallet. Tallene under kommer fra dine egne fliser i stedet for
# kortets. `bare_hero: true` krever ki-cards 4.4.0.

type: custom:bubble-card
card_type: pop-up
name: Server
icon: mdi:server
hash: '#server'
is_sidebar_hidden: true
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
styles: ".bubble-pop-up-container {\n  --vertical-stack-card-gap: 0px !important;\n}\n#header-container > div > div { background: var(--gray000) !important; }\n#header-container > button { background: none;\
  \ }\n.icon-container { background-color: var(--gray1000) !important; }\n.icon-container > ha-icon { color: var(--black) !important; opacity: 1 !important; }\n.bubble-icon { --mdc-icon-size: 24px !important;\
  \ }\n.bubble-name {\n  font-size: 30px !important;\n  font-weight: 500;\n  line-height: 1.4 !important;\n  padding: 8px 0 !important;\n}\n.bubble-close-button { background-color: var(--gray200) !important;\
  \ border-radius: 50%; }\n"
cards:
- type: custom:gap-card
  height: 0
- type: custom:simple-tabs
  alignment: center
  tab_position: top
  show_fade: false
  tabs_gap: 4px
  button_padding: 9px 22px
  background-color: transparent
  border-color: transparent
  text-color: rgba(255, 255, 255, 0.72)
  hover-color: rgba(255, 255, 255, 0.95)
  container_background: transparent
  container_padding: 0 0 12px 0
  tabs:
  - title: Unraid
    card:
      type: vertical-stack
      cards:
      - type: custom:ki-server-card
        unraid: d_day_darling
        fane: unraid
        bare_hero: true
      - type: custom:gap-card
        height: 10
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_cpu_usage
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:cpu-64-bit
            sub_text: CPU
            main_text: "[[[\n  if (!entity || isNaN(parseFloat(entity.state))) return '–';\n  return parseFloat(entity.state).toFixed(0) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\"\
              >%</span>';\n]]]\n"
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_ram_usage
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:memory
            sub_text: RAM
            main_text: "[[[\n  if (!entity || isNaN(parseFloat(entity.state))) return '–';\n  return parseFloat(entity.state).toFixed(0) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\"\
              >%</span>';\n]]]\n"
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_array_usage
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:harddisk
            sub_text: Array brukt
            main_text: "[[[\n  if (!entity || isNaN(parseFloat(entity.state))) return '–';\n  return parseFloat(entity.state).toFixed(0) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\"\
              >%</span>';\n]]]\n"
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_cpu_temperature
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:thermometer
            sub_text: Temperatur
            main_text: "[[[\n  if (!entity || isNaN(parseFloat(entity.state))) return '–';\n  return parseFloat(entity.state).toFixed(0) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\"\
              >°</span>';\n]]]\n"
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_up_since
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:clock-outline
            sub_text: Oppe
            main_text: "[[[\n  if (!entity) return '–';\n  const d = new Date(entity.state);\n  if (isNaN(d)) return entity.state;\n  const t = (Date.now() - d.getTime()) / 86400000;\n  if (t >= 1) return\
              \ Math.floor(t) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\">døgn</span>';\n  return Math.floor(t * 24) + '<span style=\"font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;\"\
              >t</span>';\n]]]\n"
        - type: custom:button-card
          template: universal_sensor_ny
          entity: sensor.d_day_darling_container_updates_available
          variables:
            size: big
            background_color: var(--gray200)
            text_color: var(--gray1000)
            icon: mdi:cloud-download
            sub_text: Oppdateringer
            main_text: "[[[\n  if (!entity || isNaN(parseFloat(entity.state))) return '–';\n  return parseFloat(entity.state).toFixed(0) + '';\n]]]\n"
      - type: custom:mini-graph-card
        entities:
        - entity: sensor.d_day_darling_cpu_usage
        name: CPU per dag
        hours_to_show: 168
        aggregate_func: max
        group_by: date
        font_size: 50
        font_size_header: 12
        hour24: true
        line_color: var(--blue)
        show:
          graph: bar
          legend: false
          icon: false
          labels: false
          labels_secondary: false
        card_mod:
          style: "ha-card { background: var(--gray200); margin-top: 12px; }\n.header { padding: 2px 8px 8px 16px; }\n.name > span { font-weight: 400 !important; font-size: 14px !important; }\n.state__uom\
            \ {\n  font-weight: 300 !important;\n  font-size: 14px !important;\n  opacity: 1 !important;\n  margin-top: 0 !important;\n  margin-bottom: 2px !important;\n}\n.state__value { font-size: 32px\
            \ !important; }\n"
      - type: custom:mini-graph-card
        entities:
        - entity: sensor.d_day_darling_array_usage
        name: Array brukt per dag
        hours_to_show: 168
        aggregate_func: max
        group_by: date
        font_size: 50
        font_size_header: 12
        hour24: true
        line_color: var(--green)
        show:
          graph: bar
          legend: false
          icon: false
          labels: false
          labels_secondary: false
        card_mod:
          style: "ha-card { background: var(--gray200); margin-top: 12px; }\n.header { padding: 2px 8px 8px 16px; }\n.name > span { font-weight: 400 !important; font-size: 14px !important; }\n.state__uom\
            \ {\n  font-weight: 300 !important;\n  font-size: 14px !important;\n  opacity: 1 !important;\n  margin-top: 0 !important;\n  margin-bottom: 2px !important;\n}\n.state__value { font-size: 32px\
            \ !important; }\n"

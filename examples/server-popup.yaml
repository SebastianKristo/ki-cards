                  ok: 'on'
                  feil: qBittorrent er stoppet
                  alvor: rod
                - entity: sensor.qbittorrent_connection_status
                  ok: connected
                  feil: 'VPN-porten er ikke åpen ({verdi})'
                  alvor: rod
                - entity: sensor.qbittorrent_errored_torrents
                  over: 0
                  feil: '{verdi} torrenter med feil'
                - entity: switch.d_day_darling_container_binhex_sonarr
                  ok: 'on'
                  feil: Sonarr er stoppet
                - entity: switch.d_day_darling_container_binhex_radarr
                  ok: 'on'
                  feil: Radarr er stoppet
                - entity: switch.d_day_darling_container_binhex_prowlarr
                  ok: 'on'
                  feil: Prowlarr er stoppet
                - entity: switch.d_day_darling_container_flaresolverr
                  ok: 'on'
                  feil: Flaresolverr er stoppet
                - entity: switch.d_day_darling_container_bazarr
                  ok: 'on'
                  feil: Bazarr er stoppet
              tall:
                - navn: Ned
                  entity: sensor.qbittorrent_download_speed
                  enhet: ' MB/s'
                  desimaler: 1
                - navn: Opp
                  entity: sensor.qbittorrent_upload_speed
                  enhet: ' MB/s'
                  desimaler: 1
                - navn: Aktive
                  entity: sensor.qbittorrent_active_torrents
                  desimaler: 0
                - navn: I kø
                  entity: sensor.qbittorrent_all_torrents

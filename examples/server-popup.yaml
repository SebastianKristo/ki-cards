  - title: Proxmox
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.overloaded
        state: 'on'
      card:
        type: custom:ki-sensor-card
        storrelse: liten
        entity: binary_sensor.overloaded
        navn: Advarsel
        ikon: mdi:alert-octagon-outline
        verdi: Noden er overbelastet
        bakgrunn: var(--red)
        tekstfarge: var(--black)
        animasjon: puls
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.disk_overloaded
        state: 'on'
      card:
        type: custom:ki-sensor-card
        storrelse: liten
        entity: binary_sensor.disk_overloaded
        navn: Advarsel
        ikon: mdi:alert-octagon-outline
        verdi: Disken er overbelastet
        bakgrunn: var(--red)
        tekstfarge: var(--black)
        animasjon: puls
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.stressed
        state: 'on'
      card:
        type: custom:ki-sensor-card
        storrelse: liten
        entity: binary_sensor.stressed
        navn: Advarsel
        ikon: mdi:alert-octagon-outline
        verdi: Noden er stresset
        bakgrunn: var(--orange)
        tekstfarge: var(--black)
        animasjon: puls

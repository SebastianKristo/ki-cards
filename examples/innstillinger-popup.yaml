# Innstillinger-popup bygget med ki-cards (v1.3.0+). Flat layout uten toppfaner.
type: custom:bubble-card
card_type: pop-up
name: Innstillinger
icon: mdi:cog
state: null
hash: '#settings'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container { --vertical-stack-card-gap: 0px!important; }
  #header-container > div > div { background: var(--gray000)!important; }
  #header-container > button {background: none;}
  .icon-container {background-color:var(--gray1000)!important;}
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon { --mdc-icon-size: 24px !important; }
  .bubble-name { font-size: 30px !important; font-weight: 500; line-height: 1.4 !important; padding: 8px 0 !important; }
  .bubble-close-button { background-color: var(--gray200) !important; border-radius: 50%; }
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
tap_action:
  action: navigate
  navigation_path: /config
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:ki-toggle-card
        size: tile
        entity: input_boolean.ki_helgemodus
        name: Helgemodus
        label: Senere oppvarming og lys
        icon: mdi:airplane-takeoff
      - type: custom:ki-toggle-card
        size: tile
        entity: input_boolean.ki_sommermodus
        name: Sommermodus
        label: Varme av, kjøling på
        icon: mdi:sun-angle
  - type: custom:gap-card
    height: 14
  - type: custom:ki-tabs-card
    tabs:
      - title: Automasjoner
        cards:
          - type: custom:ki-toggle-list-card
            sort: domain
            include:
              - domain: automation
                entity_id: automation.automation*
              - entity_id: input_boolean.ki_styr_hanklevarmer
              - entity_id: input_boolean.ki_klima_hovedbryter
      - title: Push varsler
        cards:
          - type: custom:ki-toggle-list-card
            include:
              - domain: automation
                entity_id: automation.push_automation*
            empty: Ingen push-automasjoner
      - title: Alarm
        cards:
          - type: custom:ki-vekking-card
            name: Gradvis lys
            prefix: alarm
            automation: automation.soverom_vekkealarm_gradvis_lys
            conditions:
              - entity: switch.sebastian_posisjon_hjemme_borte
                name: Sebastian hjemme
              - entity: input_boolean.ki_klima_hovedbryter
                name: Klimastyring
            test_confirm: Kjøre vekkesekvensen nå? Lysene fader opp og slukkes etter innstilt tid.
          - type: custom:gap-card
            height: 12
          - type: custom:ki-toggle-list-card
            sort: domain
            include:
              - domain: automation
                entity_id: automation.innstillinger*
              - entity_id: input_boolean.innendors_privace_mode
  - type: custom:gap-card
    height: 120

# Innstillinger-popup (ki-cards v2). Én ki-tabs-card med style: auto → nedtrekksmeny når fanene ikke får plass,
# sticky: true holder menyen øverst mens innholdet scroller.
type: custom:bubble-card
card_type: pop-up
state: null
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container { --vertical-stack-card-gap: 0px!important; }
  #header-container > div > div { background: var(--gray000)!important; }
  #header-container > button {background: none;}
  .icon-container {background-color:var(--gray1000)!important;}
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon { --mdc-icon-size: 24px !important; }
  .bubble-name { font-size: 30px !important; font-weight: 500; line-height: 1.4 !important; padding: 8px 0 !important; }
  .bubble-close-button { background-color: var(--gray200) !important; border-radius: 50%; }
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
name: Innstillinger
icon: mdi:cog
hash: '#settings'
tap_action:
  action: navigate
  navigation_path: /config
cards:
  - type: custom:ki-tabs-card
    style: auto            # pills | dropdown | auto
    sticky: true
    tabs:
      - title: Automasjoner
        icon: mdi:robot
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:ki-toggle-card
                size: tile
                entity: switch.ki_helgemodus
                name: Helgemodus
                icon: mdi:airplane-takeoff
              - type: custom:ki-toggle-card
                size: tile
                entity: switch.ki_sommermodus
                name: Sommermodus
                icon: mdi:sun-angle
          - type: custom:ki-section-card
            title: Automasjoner
          - type: custom:ki-toggle-list-card
            include:
              - domain: automation
                entity_id: automation.automation*
              - entity_id: switch.ki_styr_hanklevarmer
              - entity_id: switch.ki_klima_hovedbryter
            sort: domain
          - type: custom:gap-card
            height: 120
      - title: Varsler
        icon: mdi:bell
        cards:
          - type: custom:ki-toggle-list-card
            include:
              - domain: automation
                entity_id: automation.push_automation*
          - type: custom:gap-card
            height: 120
      - title: Vekking
        icon: mdi:alarm
        cards:
          # Finner alarmen selv (sensor.soverom_vekking_neste_alarm). Sett prefix: hvis du har flere.
          - type: custom:ki-vekking-card
            name: Soverom
          - type: custom:gap-card
            height: 12
          - type: custom:ki-toggle-list-card
            include:
              - domain: automation
                entity_id: automation.innstillinger*
              - entity_id: input_boolean.innendors_privace_mode
            sort: domain
          - type: custom:gap-card
            height: 120
      - title: Søvn
        icon: mdi:sleep
        cards:
          - type: custom:ki-sovn-card
          - type: custom:gap-card
            height: 120
      - title: Planter
        icon: mdi:flower-outline
        cards:
          - type: custom:ki-planter-card
          - type: custom:gap-card
            height: 120

# Badebasseng-popupen (ki-cards 5.68 / ki-basseng-card 2.0).
#
# Endret denne runden:
#   · Alt ligger i ett kort. Varmepumpe-bannerne og ikonrada var ~150 linjer button-card
#     over kortet; nå tegner kortet dem selv (`varmepumpe:`, `stillemodus:`, `hurtig:`),
#     med samme tre tilstander – av, på og uten svar.
#   · Ny fane «Varme»: temperatur mot målet med −/+ for ønsket temperatur, pooltaket som
#     én stor bryter, nattsenkingen (vinduet i natt, hva den sparer, og hvorfor) og
#     klorloggen med «Logg klortablett».
#   · Oversikt har fått fliser for pooltak, nattsenking og klor, og varsler øverst når
#     det er på tide med klortablett eller varmepumpa står av for natta.
#   · Pooltaket har ingen egen entitet her; det er bryteren fra integrasjonen,
#     switch.ki_basseng_pooltak_pa, som gjelder. Den er en flis på Oversikt og den store
#     bryteren på Varme.

type: custom:bubble-card
card_type: pop-up
name: Badebasseng
icon: mdi:pool
hash: '#badebasseng'
is_sidebar_hidden: true
bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
styles: >
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 12px !important;
  }

  #header-container > div > div { background: var(--gray000) !important; }

  #header-container > button { background: none; }

  .bubble-name { font-size: 30px !important; font-weight: 500; padding: 8px 0
  !important; }

  .bubble-close-button { background-color: var(--gray200) !important;
  border-radius: 50%; }

cards:
  - type: custom:gap-card
    height: 0

  - type: custom:ki-basseng-card
    varmepumpe: climate.basseng_bassengvarmepumpe
    stillemodus: switch.baseng_basengvarmepumpe_stillemodus
    # Knappene øverst: det man åpner popupen for. Trykk veksler, langt trykk åpner.
    hurtig:
      - entity: light.bassenglys
        navn: Lys
      - entity: switch.bassengpumpe
        navn: Pumpe
      - entity: climate.basseng_bassengvarmepumpe
        navn: Varme
      - entity: switch.baseng_basengvarmepumpe_stillemodus
        navn: Stille
        ikon: mdi:volume-off
      - entity: switch.baseng_stikkontakt
        navn: Stikk
        ikon: mdi:power-socket-eu
    faner:
      - oversikt
      - varme
      - sirkulasjon
      - spreder
      - innstillinger

  - type: custom:gap-card
    height: 36

popup_mode: default

# Ny fane «Sparing» i Tesla-popupen.
#
# Lim inn som et element i `tabs:`-lista under `type: custom:simple-tabs`,
# for eksempel etter «Lading». Resten av popupen er uendret.

- title: Sparing
  card:
    type: vertical-stack
    cards:
      - type: custom:gap-card
        height: 0

      # Selve sammenligningen. Periodepillene byttes i kortet.
      - type: custom:ki-sparing-card
        prefiks: sensor.ki_drivstoff_
        periode: maaned
        perioder: [i_dag, maaned, aar, totalt]

      - type: custom:gap-card
        height: 10

      # Pumpeprisen og det du betaler for lading, i samme stil som resten av popupen
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: universal_sensor_ny
            entity: sensor.ki_drivstoff_dieselpris
            variables:
              sub_text: Uno-X Gressbanen
              icon: mdi:gas-station
              background_color: var(--gray200)
              text_color: var(--gray1000)
              main_text: |
                [[[
                  if (!entity || isNaN(parseFloat(entity.state))) return '–';
                  return parseFloat(entity.state).toFixed(2) + '<span style="font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;">kr/L</span>';
                ]]]
          - type: custom:button-card
            template: universal_sensor_ny
            entity: sensor.ki_drivstoff_ladepris
            variables:
              sub_text: Ladepris
              icon: mdi:ev-station
              background_color: var(--gray200)
              text_color: var(--gray1000)
              main_text: |
                [[[
                  if (!entity || isNaN(parseFloat(entity.state))) return '–';
                  return parseFloat(entity.state).toFixed(2) + '<span style="font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;">kr/kWh</span>';
                ]]]

      - type: custom:gap-card
        height: 10

      # Sparingen over tid. Krever at sensorene har state_class total, som de har.
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.ki_drivstoff_spart_denne_maneden
        name: Spart denne måneden
        hours_to_show: 720
        aggregate_func: max
        group_by: date
        font_size: 50
        font_size_header: 12
        hour24: true
        show:
          graph: bar
          legend: false
          icon: false
          labels: false
          labels_secondary: false
        card_mod:
          style: |
            ha-card { background: var(--gray200); }
            .header { padding: 2px 8px 8px 16px; }
            .name > span { font-weight: 400 !important; font-size: 14px !important; }
            .state__uom {
              font-weight: 300 !important;
              font-size: 14px !important;
              opacity: 1 !important;
              margin-top: 0 !important;
              margin-bottom: 2px !important;
            }
            .state__value { font-size: 32px !important; }

      # Vises bare hvis hentingen av pumpeprisen feiler
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.ki_drivstoff_dieselpris
            state: unknown
        card:
          type: custom:button-card
          name: >-
            [[[ return '<strong>Pumpepris mangler:</strong> ' +
            (states['sensor.ki_drivstoff_dieselpris'].attributes.feil || 'ukjent årsak') ]]]
          icon: mdi:alert-outline
          tap_action:
            action: perform-action
            perform_action: ki_drivstoff.hent_pris
          styles:
            card:
              - padding: 0
              - background: var(--orange)
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 76px 1fr
            img_cell:
              - justify-self: start
              - background: rgba(0,0,0, 0.1)
              - margin: 4px 4px
              - border-radius: 50%
              - width: 58px
              - height: 58px
            icon:
              - width: 30px
              - height: 30px
              - color: var(--black)
            name:
              - justify-self: start
              - color: var(--black)
              - font-size: 14px

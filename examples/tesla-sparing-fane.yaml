# Fanen «Sparing» i Tesla-popupen.
#
# Lim inn som et element i `tabs:`-lista under `type: custom:simple-tabs`,
# for eksempel etter «Lading». Resten av popupen er uendret.
#
# Kortet inneholder alt: beløpet, fordelingen, kilometer, liter, CO₂ og prisene.
# Ingen ekstra fliser ved siden av – de gjentok bare det som allerede står i kortet.

- title: Sparing
  card:
    type: vertical-stack
    cards:
      - type: custom:gap-card
        height: 0

      - type: custom:ki-sparing-card
        prefiks: sensor.ki_drivstoff_
        periode: maaned
        perioder: [i_dag, maaned, aar, totalt]

      # Vises bare hvis hentingen av pumpeprisen feiler. Trykk for å prøve igjen.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.ki_drivstoff_dieselpris
            state: unknown
        card:
          type: custom:button-card
          name: Hent pumpeprisen på nytt
          icon: mdi:refresh
          tap_action:
            action: perform-action
            perform_action: ki_drivstoff.hent_pris
          styles:
            card:
              - padding: 0
              - margin-top: 12px
              - background: var(--orange)
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 76px 1fr
            img_cell:
              - justify-self: start
              - background: rgba(0,0,0, 0.1)
              - margin: 4px 4px
              - border-radius: 50%
              - width: 58px
              - height: 58px
            icon:
              - width: 30px
              - height: 30px
              - color: var(--black)
            name:
              - justify-self: start
              - color: var(--black)

# Søppel-popupen — ditt originale oppsett, med en animert topp over.
#
# Rutenettet er uendret: auto-entities som lager to kolonner av
# template_sensor_big_alt, sortert på days_to_pickup. Kortet skal være til å kjenne igjen.
#
# Over det ligger ki-avfall-card med `fliser: false`, altså bare heroen — den dupliserer
# ikke fraksjonene under. Den viser neste tømming stort, og på tømmedagen skifter den til
# fraksjonens farge, tallet pulserer, bøtta rister og søppelbilen kjører over.
#
# Flisene har fått tilbake ikonet i det runde feltet med bakgrunn — samme plassering som
# universal_sensor_ny-flisene ellers i dashbordet. `icon: null` gjorde at det feltet sto
# tomt, så søppelflisene var de eneste uten. Ikonet og bakgrunnen får fraksjonens farge:
# papir blått, plast lilla, glass og metall grønt, restavfall grått.
#
# Ellers: «I morgen» og riktig entall i text_main. Før sto det «1 dager».

type: custom:bubble-card
card_type: pop-up
name: Søppel
icon: mdi:trash-can
state: null
hash: '#soppel'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  } #header-container > div > div {
    background: var(--gray000)!important;
  }     
  #header-container > button {background: none;}    
  .icon-container {background-color:var(--gray1000)!important;} 
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon {
    --mdc-icon-size: 24px !important;
  }
  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;

  }
  .bubble-close-button {
    background-color: var(--gray200) !important;
    border-radius: 50%;
  }



bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
sub_button:
  main: []
  bottom: []
slider_fill_orientation: left
slider_value_position: right
cards:
  - type: custom:gap-card
    height: 0

  # Animert topp: neste tømming stort, med søppelbil på tømmedagen.
  # `fliser: false` gjør at kortet bare viser heroen — fraksjonene står i rutenettet under.
  - type: custom:ki-avfall-card
    monster: "sensor\\.(glass_og_metallemballasje|plastemballasje|papir_og_papp|restavfall)"
    dager_attributt: days_to_pickup
    dato_attributt: raw_date
    fliser: false
    hoyde: 150

  - type: custom:gap-card
    height: 10

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - entity_id: >-
            /sensor.(glass_og_metallemballasje|plastemballasje|papir_og_papp|restavfall)/
          options:
            type: custom:button-card
            template: template_sensor_big_alt
            entity: this.entity_id
            variables:
              margin: 0
              # Tømmes den i dag, får hele flisen fraksjonens farge — samme grep som
              # de andre flisene dine bruker for aktiv tilstand
              background_color: |
                [[[
                  if (entity.attributes.days_to_pickup !== 0) return 'var(--gray200)';
                  const n = (entity.attributes.friendly_name || '').toLowerCase();
                  if (n.includes('glass') || n.includes('metall')) return 'var(--green)';
                  if (n.includes('plast')) return 'var(--purple)';
                  if (n.includes('papir') || n.includes('papp')) return 'var(--blue)';
                  if (n.includes('mat')) return 'var(--orange)';
                  return 'var(--gray600)';
                ]]]
              text_color: |
                [[[
                  return entity.attributes.days_to_pickup === 0
                    ? 'var(--black)' : 'var(--gray1000)';
                ]]]
              text_sub: '[[[ return entity.attributes.friendly_name ]]]'
              text_main: |
                [[[
                  const d = entity.attributes.days_to_pickup;
                  if (d === 0) return 'I dag';
                  if (d === 1) return 'I morgen';
                  return d + '<span style="font-size:14px;line-height:1.5em"> dager</span>';
                ]]]
              text_alt: |
                [[[ 
                    const date = new Date(entity.attributes.raw_date);
                    const day = date.getDate();
                    const month = date.toLocaleString('nb-NO', { month: 'short' }).replace('.', '');
                    return day + '. ' + month;
                ]]]          
              # Ikonet i det runde feltet, som på de andre flisene i dashbordet
              icon: |
                [[[
                  const n = (entity.attributes.friendly_name || '').toLowerCase();
                  if (n.includes('glass') || n.includes('metall')) return 'mdi:bottle-soda-classic-outline';
                  if (n.includes('plast')) return 'mdi:recycle';
                  if (n.includes('papir') || n.includes('papp')) return 'mdi:newspaper-variant-outline';
                  if (n.includes('mat')) return 'mdi:food-apple-outline';
                  if (n.includes('hage')) return 'mdi:leaf';
                  return 'mdi:trash-can-outline';
                ]]]
              # Fraksjonens farge på ikonet. Tømmes den i dag, er hele flisen allerede
              # i den fargen — da må ikonet bli mørkt, ellers forsvinner det i bakgrunnen.
              color: |
                [[[
                  if (entity.attributes.days_to_pickup === 0) return 'var(--black)';
                  const n = (entity.attributes.friendly_name || '').toLowerCase();
                  if (n.includes('glass') || n.includes('metall')) return 'var(--green)';
                  if (n.includes('plast')) return 'var(--purple)';
                  if (n.includes('papir') || n.includes('papp')) return 'var(--blue)';
                  if (n.includes('mat')) return 'var(--orange)';
                  return 'var(--gray600)';
                ]]]
              icon_color: |
                [[[
                  if (entity.attributes.days_to_pickup === 0) return 'var(--black)';
                  const n = (entity.attributes.friendly_name || '').toLowerCase();
                  if (n.includes('glass') || n.includes('metall')) return 'var(--green)';
                  if (n.includes('plast')) return 'var(--purple)';
                  if (n.includes('papir') || n.includes('papp')) return 'var(--blue)';
                  if (n.includes('mat')) return 'var(--orange)';
                  return 'var(--gray600)';
                ]]]
    sort:
      method: attribute
      attribute: days_to_pickup
      numeric: true
      reverse: false
    show_empty: true

popup_mode: default

# Søppel-popupen — ditt originale oppsett, med en animert topp over.
#
# Rutenettet er uendret: auto-entities som lager to kolonner av
# template_sensor_big_alt, sortert på days_to_pickup. Kortet skal være til å kjenne igjen.
#
# Over det ligger ki-avfall-card med `fliser: false`, altså bare heroen — den dupliserer
# ikke fraksjonene under. Den viser neste tømming stort, og på tømmedagen skifter den til
# fraksjonens farge, tallet pulserer, bøtta rister og søppelbilen kjører over.
#
# Flisene har fått tilbake ikonet i det runde feltet med bakgrunn — samme plassering som
# universal_sensor_ny-flisene ellers i dashbordet. `icon: null` gjorde at det feltet sto
# tomt, så søppelflisene var de eneste uten. Ikonet og bakgrunnen får fraksjonens farge:
# papir blått, plast lilla, glass og metall grønt, restavfall grått.
#
# Ellers: «I morgen» og riktig entall i text_main. Før sto det «1 dager».

type: custom:bubble-card
card_type: pop-up
name: Søppel
icon: mdi:trash-can
state: null
hash: '#soppel'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  } #header-container > div > div {
    background: var(--gray000)!important;
  }     
  #header-container > button {background: none;}    
  .icon-container {background-color:var(--gray1000)!important;} 
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon {
    --mdc-icon-size: 24px !important;
  }
  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;

  }
  .bubble-close-button {
    background-color: var(--gray200) !important;
    border-radius: 50%;
  }



bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
sub_button:
  main: []
  bottom: []
slider_fill_orientation: left
slider_value_position: right
cards:
  - type: custom:gap-card
    height: 0

  # Animert topp: neste tømming stort, med søppelbil på tømmedagen.
  # `fliser: false` gjør at kortet bare viser heroen — fraksjonene står i rutenettet under.
  #
  # Sensorene listes eksplisitt. Kortet støtter også `monster:` med et regexuttrykk, men
  # bakstrekene i et slikt uttrykk overlever ikke alltid en runde i YAML-editoren, og et
  # mønster som havarerer er vondt å se forskjell på et som treffer for bredt. En liste
  # er kjedeligere og alltid riktig.
  - type: custom:ki-avfall-card
    entities:
      - sensor.restavfall
      - sensor.papir_og_papp
      - sensor.plastemballasje
      - sensor.glass_og_metallemballasje
    dager_attributt: days_to_pickup
    dato_attributt: raw_date
    fliser: false
    hoyde: 150

  - type: custom:gap-card
    height: 10

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - entity_id: >-
            /sensor.(glass_og_metallemballasje|plastemballasje|papir_og_papp|restavfall)/
          options:
            # Flisen er bygget rett i button-card i stedet for i template_sensor_big_alt.
            # Malen har stor skrift i ett felt, og «I morgen» ble klippet til «I mo…».
            # Formspråket er beholdt: rundt ikonfelt til venstre, liten etikett over,
            # stor verdi under, dato nederst. Nedtellingen får hele bredden av
            # tekstkolonnen, så ingenting trenger å klippes.
            type: custom:button-card
            entity: this.entity_id
            show_icon: true
            show_name: true
            show_label: false
            tap_action:
              action: more-info
            icon: |
              [[[
                const n = (entity.attributes.friendly_name || '').toLowerCase();
                if (n.includes('glass') || n.includes('metall')) return 'mdi:bottle-soda-classic-outline';
                if (n.includes('plast')) return 'mdi:recycle';
                if (n.includes('papir') || n.includes('papp')) return 'mdi:newspaper-variant-outline';
                if (n.includes('mat')) return 'mdi:food-apple-outline';
                if (n.includes('hage')) return 'mdi:leaf';
                return 'mdi:trash-can-outline';
              ]]]
            # Nedtellingen. Tall stort, ord litt mindre — men ingen klipping.
            name: |
              [[[
                const d = entity.attributes.days_to_pickup;
                if (d === 0) return 'I dag';
                if (d === 1) return 'I morgen';
                return d + '<span style="font-size:14px;font-weight:400;opacity:.6;margin-left:4px">dager</span>';
              ]]]
            custom_fields:
              frak: |
                [[[ return entity.attributes.friendly_name ]]]
              dato: |
                [[[
                  const dt = new Date(entity.attributes.raw_date);
                  const ukedag = dt.toLocaleDateString('nb-NO', { weekday: 'short' }).replace('.', '');
                  const mnd = dt.toLocaleDateString('nb-NO', { month: 'short' }).replace('.', '');
                  return ukedag + ' ' + dt.getDate() + '. ' + mnd;
                ]]]
            styles:
              card:
                - border-radius: 24px
                - padding: 0
                - height: 104px
                - background: |
                    [[[
                      if (entity.attributes.days_to_pickup !== 0) return 'var(--gray200)';
                      const n = (entity.attributes.friendly_name || '').toLowerCase();
                      if (n.includes('glass') || n.includes('metall')) return 'var(--green)';
                      if (n.includes('plast')) return 'var(--purple)';
                      if (n.includes('papir') || n.includes('papp')) return 'var(--blue)';
                      if (n.includes('mat')) return 'var(--orange)';
                      return 'var(--gray600)';
                    ]]]
              grid:
                - grid-template-areas: '"i frak" "i n" "i dato"'
                - grid-template-columns: 70px 1fr
                - grid-template-rows: 1fr auto 1fr
                - align-items: center
              img_cell:
                - justify-self: center
                - align-self: center
                - width: 50px
                - height: 50px
                - border-radius: 50%
                - background: |
                    [[[
                      if (entity.attributes.days_to_pickup === 0) return 'rgba(0,0,0,.14)';
                      const n = (entity.attributes.friendly_name || '').toLowerCase();
                      if (n.includes('glass') || n.includes('metall')) return 'color-mix(in srgb, var(--green) 26%, transparent)';
                      if (n.includes('plast')) return 'color-mix(in srgb, var(--purple) 26%, transparent)';
                      if (n.includes('papir') || n.includes('papp')) return 'color-mix(in srgb, var(--blue) 26%, transparent)';
                      if (n.includes('mat')) return 'color-mix(in srgb, var(--orange) 26%, transparent)';
                      return 'color-mix(in srgb, var(--gray600) 26%, transparent)';
                    ]]]
              icon:
                - width: 24px
                - height: 24px
                - color: |
                    [[[
                      if (entity.attributes.days_to_pickup === 0) return 'var(--black)';
                      const n = (entity.attributes.friendly_name || '').toLowerCase();
                      if (n.includes('glass') || n.includes('metall')) return 'var(--green)';
                      if (n.includes('plast')) return 'var(--purple)';
                      if (n.includes('papir') || n.includes('papp')) return 'var(--blue)';
                      if (n.includes('mat')) return 'var(--orange)';
                      return 'var(--gray600)';
                    ]]]
              name:
                - grid-area: n
                - justify-self: start
                - align-self: start
                - font-size: 24px
                - font-weight: 500
                - letter-spacing: '-0.02em'
                - white-space: nowrap
                - padding-right: 12px
                - color: |
                    [[[ return entity.attributes.days_to_pickup === 0
                      ? 'var(--black)' : 'var(--gray1000)' ]]]
              custom_fields:
                frak:
                  - grid-area: frak
                  - justify-self: start
                  - align-self: end
                  - font-size: 12px
                  - font-weight: 500
                  - opacity: 0.62
                  - white-space: nowrap
                  - overflow: hidden
                  - text-overflow: ellipsis
                  - max-width: 100%
                  - padding-right: 12px
                  - color: |
                      [[[ return entity.attributes.days_to_pickup === 0
                        ? 'var(--black)' : 'var(--gray1000)' ]]]
                dato:
                  - grid-area: dato
                  - justify-self: start
                  - align-self: start
                  - font-size: 12px
                  - opacity: 0.5
                  - white-space: nowrap
                  - padding-right: 12px
                  - color: |
                      [[[ return entity.attributes.days_to_pickup === 0
                        ? 'var(--black)' : 'var(--gray1000)' ]]]
    sort:
      method: attribute
      attribute: days_to_pickup
      numeric: true
      reverse: false
    show_empty: true

popup_mode: default

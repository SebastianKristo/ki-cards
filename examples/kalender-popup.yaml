# Kalenderfanen i #kalender-popupen: månedsrutenett øverst, hendelsene under.
# Erstatter stabelen av button-card mot sensor.alle_kalendere.
type: custom:ki-kalender-card
tittel: Kalender
start_dag: mandag
prikker: 4
dager_i_liste: 1          # 1 = bare dagen du trykker på; sett høyere for en agenda framover
kalendere:
  - entity: calendar.sebastian_kristo_no
    navn: Sebastian
    farge: var(--active-big)
  - entity: calendar.helge_hus
    navn: Helge hus
    farge: var(--blue)
  - entity: calendar.oslomet_timeplan
    navn: OsloMet
    farge: var(--green)
  - entity: calendar.timeplan
    navn: Timeplan
    farge: var(--teal)
  - entity: calendar.arbeidsdag_sensor_calendar
    navn: Arbeidsdag
    farge: var(--orange)
  - entity: calendar.helligdager_i_norge
    navn: Helligdager
    farge: var(--red)
  - entity: calendar.birthdays
    navn: Bursdager
    farge: var(--yellow)
  - entity: calendar.posten_calendar
    navn: Posten
    farge: var(--purple)
  - entity: calendar.todoist
    navn: Todoist
    farge: var(--gray800)

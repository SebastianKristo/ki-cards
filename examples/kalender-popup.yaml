# Kalender-popupen: fanene Kalender / Hytta / Framover, og knappen utenfor rada.
#
# Knappen utenfor bytter både ikon og innhold etter hvor du står:
#   på Kalender  → kalenderikon, og månedskalenderen
#   ellers       → gaveikon, og post + bursdager, som før
#
# Kortene i Kalender-fanen er dine egne og står uendret – de er bare kortet ned her.

type: custom:ki-tabs-card
align: center
tabs:
  - title: Kalender
    cards:
      # ── dine sju button-card mot sensor.alle_kalendere, uendret ──
      - type: custom:gap-card
        height: 48

  - title: Hytta
    cards:
      - type: custom:ki-hytte-card
        sveip: true
        alle_steder: true
        faner: [kalender, opphold, statistikk]
      - type: custom:gap-card
        height: 48

  - title: Framover
    cards:
      - type: custom:ki-lansering-card
        serier: sensor.sonarr_sonarr_upcoming_media
        filmer: sensor.radarr_radarr_upcoming_media
        antall: 6
        bursdag:
          kalender: calendar.birthdays
          dager: 90
        plakater: true
      - type: custom:gap-card
        height: 48

  - icon: mdi:gift-outline
    aria: Post og bursdager
    utenfor: true
    ikon_naar:
      Kalender: mdi:calendar-month
    kort_naar:
      Kalender:
        - type: custom:ki-kalender-card
          start_dag: mandag
          visning: antall
          dager_i_liste: 1
          kalendere:
            - entity: calendar.sebastian_kristo_no
              navn: Sebastian
              farge: var(--active-big)
            - entity: calendar.helge_hus
              navn: Helge hus
              farge: var(--blue)
            - entity: calendar.oslomet_timeplan
              navn: OsloMet
              farge: var(--green)
            - entity: calendar.timeplan
              navn: Timeplan
              farge: var(--teal)
            - entity: calendar.arbeidsdag_sensor_calendar
              navn: Arbeidsdag
              farge: var(--orange)
            - entity: calendar.helligdager_i_norge
              navn: Helligdager
              farge: var(--red)
            - entity: calendar.birthdays
              navn: Bursdager
              farge: var(--yellow)
            - entity: calendar.posten_calendar
              navn: Posten
              farge: var(--purple)
            - entity: calendar.todoist
              navn: Todoist
              farge: var(--gray800)
        - type: custom:gap-card
          height: 48
    cards:
      - type: custom:ki-post-card
        entity: sensor.nar_kommer_posten_posten_sensor_next
        relativ: sensor.nar_kommer_posten_posten_sensor_next_relative
        tekst: Post leveres
      - type: custom:gap-card
        height: 14
      - type: custom:ki-bursdag-pro-card
        kalender: calendar.birthdays
        antall: 3
        legg_til: true
      - type: custom:gap-card
        height: 48
